<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro CTO - Técnico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --bg-main: #0B0F19; --bg-card: #151A27; --border-color: #2A3441; --border-focus: #3B82F6; --text-main: #E2E8F0; --text-muted: #94A3B8; --btn-primary: #3B82F6; --btn-primary-hover: #2563EB; --btn-secondary: #1E293B; --btn-secondary-hover: #334155; --success: #10B981; --warning: #F59E0B; --warning-bg: rgba(245, 158, 11, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background-color: var(--bg-card); display: flex; flex-direction: column; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
        .app-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); background-color: #111520; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .header-title h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .header-title p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        .status-online { font-size: 0.8rem; color: var(--success); font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .form-container { padding: 24px; flex: 1; overflow-y: auto; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-group input, .form-group select { width: 100%; background-color: #0B0F19; border: 1px solid var(--border-color); color: var(--text-main); padding: 14px 16px; border-radius: 8px; font-size: 1rem; transition: all 0.2s ease; }
        .form-group input::placeholder { color: #475569; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        input[readonly], input[disabled] { background-color: rgba(0,0,0,0.2) !important; color: var(--text-muted) !important; cursor: not-allowed; }
        
        .form-row { display: flex; gap: 12px; margin-bottom: 16px; }
        .form-row .form-group { margin-bottom: 0; }
        .form-group.half { flex: 1; }
        .input-with-icon { position: relative; }
        .input-with-icon input { padding-right: 40px; }
        .input-with-icon i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-with-button { display: flex; gap: 8px; }
        .input-with-button input { flex: 1; }
        .btn-icon { background-color: var(--btn-secondary); color: var(--btn-primary); border: 1px solid var(--border-color); border-radius: 8px; width: 52px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.2rem; transition: all 0.2s ease; }
        .btn-icon:hover { background-color: var(--btn-secondary-hover); }
        
        /* Estilos do Card de Observação */
        .obs-card { background-color: var(--warning-bg); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 8px; padding: 14px 16px; margin: 20px 0; display: none; align-items: flex-start; gap: 12px; animation: fadeIn 0.3s ease; }
        .obs-card.show { display: flex; }
        .obs-icon { color: var(--warning); font-size: 1.2rem; margin-top: 2px; }
        .obs-content { flex: 1; }
        .obs-title { font-size: 0.75rem; font-weight: 700; color: var(--warning); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
        .obs-text { font-size: 0.9rem; color: var(--text-main); line-height: 1.4; }

        .divider { border: none; border-top: 1px dashed var(--border-color); margin: 20px 0 20px 0; }
        .form-actions { display: flex; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .btn { padding: 16px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-secondary { background-color: var(--btn-secondary); color: var(--text-main); flex: 1; }
        .btn-secondary:hover { background-color: var(--btn-secondary-hover); }
        .btn-primary { background-color: var(--btn-primary); color: white; flex: 2; }
        .btn-primary:hover { background-color: var(--btn-primary-hover); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background-color: var(--success); color: white; padding: 14px 24px; border-radius: 50px; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000; white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        
        .file-upload-wrapper { position: relative; width: 100%; height: 50px; background-color: #0B0F19; border: 1px dashed var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; overflow: hidden; transition: all 0.2s; }
        .file-upload-wrapper:hover { border-color: var(--border-focus); color: var(--btn-primary); }
        .file-upload-wrapper.has-file { background-color: rgba(16, 185, 129, 0.1); border-color: var(--success); color: var(--success); border-style: solid; }
        .file-upload-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-title">
                <h1>REGISTRO TÉCNICO</h1>
                <p>Preenchimento em Campo</p>
            </div>
            <div id="status-sinc" class="status-online"><i class="fa-solid fa-spinner fa-spin"></i> Baixando...</div>
        </header>

        <main class="form-container">
            <form id="cto-form">

                <div class="form-group">
                    <label for="colaborador"><i class="fa-solid fa-user-gear"></i> Colaborador</label>
                    <select id="colaborador" name="colaborador" required>
                        <option value="">Carregando técnicos...</option>
                    </select>
                </div>
                
                <hr class="divider">

                <div class="form-group">
                    <label for="slotPon">SLOT PON (Aba da Planilha)</label>
                    <select id="slotPon" name="slotPon" required>
                        <option value="">Aguardando Sincronização...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mac">MAC (Buscar / Confirmar)</label>
                    <div class="input-with-icon">
                        <input type="text" id="mac" name="mac" placeholder="Selecione o Slot Primeiro..." list="mac-list" required autocomplete="off" disabled>
                        <i class="fa-solid fa-search"></i>
                    </div>
                    <datalist id="mac-list"></datalist>
                </div>

                <div class="form-group">
                    <label for="cto">CTO DA CAIXA</label>
                    <input type="text" id="cto" name="cto" placeholder="Ex: CTO.03.124" required>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="contrato">ID CONTRATO</label>
                        <input type="text" id="contrato" name="contrato" placeholder="Automático" readonly>
                    </div>
                    <div class="form-group half">
                        <label for="tipoCliente">TIPO CLIENTE</label>
                        <input type="text" id="tipoCliente" name="tipoCliente" placeholder="Automático" readonly>
                    </div>
                </div>

                <hr class="divider">

                <div class="form-group">
                    <label for="localizacao">LOCALIZAÇÃO EXATA (GPS do Poste)</label>
                    <div class="input-with-button">
                        <input type="text" id="localizacao" name="localizacao" placeholder="Aguardando GPS..." required readonly>
                        <button type="button" id="btn-gps" class="btn-icon" title="Atualizar GPS"><i class="fa-solid fa-location-crosshairs"></i></button>
                    </div>
                    <small style="color: #94A3B8; font-size: 0.65rem; display: block; margin-top: 4px;">Fique abaixo da caixa e aguarde o Erro ficar abaixo de 10m.</small>
                </div>

                <div class="form-group">
                    <label for="lacre">LACRE A COLOCAR</label>
                    <input type="text" id="lacre" name="lacre" placeholder="Ex: BDO002205" required>
                </div>

                <div class="form-group">
                    <label for="sinalCto">SINAL DA CTO (dBm)</label>
                    <!-- Somente SINAL DA CTO (coluna G), o SINAL DO CLIENTE (coluna F) foi ignorado no salvamento -->
                    <div class="input-with-button">
                        <input type="text" inputmode="decimal" pattern="-?[0-9]*([.,][0-9]+)?" id="sinalCto" name="sinalCto" placeholder="Ex: -24.53" required>
                        <button type="button" id="btn-sinal-negativo" class="btn-icon" title="Alternar Sinal Positivo/Negativo" style="font-weight: 600; font-size: 1.1rem; width: 52px; font-family: 'Inter', sans-serif;">+/-</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>FOTO DO MAC/CTO (Obrigatório)</label>
                    <div class="file-upload-wrapper" id="upload-wrapper">
                        <i class="fa-solid fa-camera" id="upload-icon" style="margin-right: 8px;"></i>
                        <span id="upload-text">Tirar Foto</span>
                        <input type="file" id="fotoMac" accept="image/*" capture="environment" required>
                    </div>
                </div>

                <!-- NOVO CAMPO: INFORMAÇÕES / OBSERVAÇÕES -->
                <div id="obs-container" class="obs-card">
                    <i class="fa-solid fa-circle-exclamation obs-icon"></i>
                    <div class="obs-content">
                        <div class="obs-title">Aviso Importante do MAC</div>
                        <div id="obs-texto" class="obs-text"></div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="btn-cancelar">Limpar</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-cloud-arrow-up"></i> Enviar</button>
                </div>
            </form>
        </main>
        
        <div id="toast" class="toast hidden">
            <i class="fa-solid fa-check-circle"></i>
            <span>Enviado com Sucesso!</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // COLE AQUI A NOVA URL GERADA NO NOVO DEPLOY DO APPS SCRIPT
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6tdT0URlgf4ES50MHQnAwlpgJDzp8w4mF8I2qUA5s71Y1J984dnDn3SKa_HcHhBlT/exec";

            let fullDatabase = {};
            let currentMacs = [];
            
            const colaboradorSelect = document.getElementById('colaborador');
            const slotPonSelect = document.getElementById('slotPon');
            const macInput = document.getElementById('mac');
            const ctoInput = document.getElementById('cto');
            const contratoInput = document.getElementById('contrato');
            const tipoClienteInput = document.getElementById('tipoCliente');
            const obsContainer = document.getElementById('obs-container');
            const obsTexto = document.getElementById('obs-texto');
            const fotoInput = document.getElementById('fotoMac');
            const uploadWrapper = document.getElementById('upload-wrapper');
            const uploadText = document.getElementById('upload-text');
            const uploadIcon = document.getElementById('upload-icon');
            const datalist = document.getElementById('mac-list');
            const statusSinc = document.getElementById('status-sinc');
            const toast = document.getElementById('toast');
            const toastMsg = toast.querySelector('span');
            const locInput = document.getElementById('localizacao');
            const btnGps = document.getElementById('btn-gps');
            const form = document.getElementById('cto-form');
            
            let photoBase64Value = "";

            // 0. CARREGAR/SALVAR COLABORADOR E BUSCAR DO APPS SCRIPT
            async function loadTecnicos() {
                try {
                    const res = await fetch(`${SCRIPT_URL}?action=get_tecnicos`);
                    const json = await res.json();
                    if (json.status === "success") {
                        colaboradorSelect.innerHTML = '<option value="">Selecione seu nome...</option>';
                        json.data.forEach(tec => {
                            const opt = document.createElement('option');
                            opt.value = tec;
                            opt.textContent = tec;
                            colaboradorSelect.appendChild(opt);
                        });
                        
                        const savedColaborador = localStorage.getItem('colaboradorSalvo');
                        if (savedColaborador) {
                            colaboradorSelect.value = savedColaborador;
                        }
                    }
                } catch (err) {
                    colaboradorSelect.innerHTML = '<option value="">Erro ao carregar técnicos</option>';
                }
            }
            if (SCRIPT_URL.startsWith("http")) { loadTecnicos(); }

            colaboradorSelect.addEventListener('change', (e) => {
                localStorage.setItem('colaboradorSalvo', e.target.value);
            });

            // 0.1 PREVIEW DA FOTO (Comprimir para Base64)
            fotoInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                uploadWrapper.classList.add('has-file');
                uploadText.innerText = "Foto Anexada!";
                uploadIcon.className = "fa-solid fa-check";
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        // Comprimir a imagem (Max Width 800px para evitar travamento de rede)
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Converter para base64 com qualidade 70%
                        photoBase64Value = canvas.toDataURL('image/jpeg', 0.7);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // 1. CARREGAR TODAS AS ABAS DA PLANILHA
            async function loadDatabase() {
                try {
                    const res = await fetch(SCRIPT_URL);
                    fullDatabase = await res.json();
                    
                    slotPonSelect.innerHTML = '<option value="">Selecione o Slot PON...</option>';
                    
                    Object.keys(fullDatabase).forEach(sheetName => {
                        const opt = document.createElement('option');
                        opt.value = sheetName;
                        opt.textContent = sheetName;
                        slotPonSelect.appendChild(opt);
                    });
                    
                    statusSinc.innerHTML = '<i class="fa-solid fa-wifi"></i> Abas Sincronizadas';

                    const savedSlot = localStorage.getItem('slotPonSalvo');
                    if (savedSlot && fullDatabase[savedSlot]) {
                        slotPonSelect.value = savedSlot;
                        slotPonSelect.dispatchEvent(new Event('change'));
                    }

                } catch(err) {
                    statusSinc.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color: #F59E0B"></i> Erro ao Sincronizar';
                }
            }
            if(SCRIPT_URL.startsWith("http")) { loadDatabase(); }

            // 2. QUANDO O TÉCNICO ESCOLHE A ABA
            slotPonSelect.addEventListener('change', (e) => {
                const selectedSlot = e.target.value;
                
                if (!selectedSlot) {
                    localStorage.removeItem('slotPonSalvo');
                    macInput.disabled = true;
                    macInput.placeholder = "Selecione o Slot Primeiro...";
                    return;
                }

                localStorage.setItem('slotPonSalvo', selectedSlot);
                macInput.disabled = false;
                macInput.placeholder = "Digite ou selecione o MAC...";
                currentMacs = fullDatabase[selectedSlot] || [];
                
                datalist.innerHTML = '';
                currentMacs.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.mac;
                    datalist.appendChild(option);
                });
                
                limparCampos(false);
            });

            // 3. BUSCAR O MAC ESPECÍFICO DESSA ABA E EXIBIR INFORMAÇÕES
            function searchMAC() {
                let typed = macInput.value.trim().toUpperCase();
                const found = currentMacs.find(x => x.mac.toUpperCase() === typed);
                
                if (found) {
                    ctoInput.value = found.cto;
                    contratoInput.value = found.contrato;
                    tipoClienteInput.value = found.tipoCliente; 
                    
                    // LÓGICA DA OBSERVAÇÃO / INFORMAÇÃO
                    if (found.observacao && found.observacao.trim() !== "") {
                        obsTexto.innerText = found.observacao;
                        obsContainer.classList.add('show');
                    } else {
                        obsContainer.classList.remove('show');
                        obsTexto.innerText = "";
                    }
                    verificarLocalizacaoCTO(found.cto);
                } else {
                    contratoInput.value = '';
                    tipoClienteInput.value = '';
                    obsContainer.classList.remove('show');
                    obsTexto.innerText = "";
                }
            }

            function verificarLocalizacaoCTO(ctoVal) {
                if (!ctoVal) return false;
                const slotVal = slotPonSelect.value;
                if (!slotVal) return false;
                
                // 1. Tentar pegar a localização direto da planilha (Master GPS)
                const macsDesteSlot = fullDatabase[slotVal] || [];
                const ctoComLoc = macsDesteSlot.find(m => m.cto.toUpperCase() === ctoVal.toUpperCase() && m.localizacao && m.localizacao.trim() !== "");
                
                if (ctoComLoc) {
                    if (watchId) navigator.geolocation.clearWatch(watchId);
                    locInput.value = ctoComLoc.localizacao + " (Copiado do Banco de Dados)";
                    btnGps.innerHTML = '<i class="fa-solid fa-cloud-arrow-down" style="color: var(--brand-purple)"></i>';
                    return true;
                }

                // 2. Se não tem na planilha, pegar do cache local do celular
                const cacheKey = 'loc_cto_' + slotVal.trim() + '_' + ctoVal.trim().toUpperCase();
                const savedLoc = localStorage.getItem(cacheKey);
                
                if (savedLoc) {
                    if (watchId) navigator.geolocation.clearWatch(watchId);
                    locInput.value = savedLoc + " (Copiado da mesma CTO local)";
                    btnGps.innerHTML = '<i class="fa-solid fa-clone" style="color: var(--success)"></i>';
                    return true;
                }
                return false;
            }

            ctoInput.addEventListener('input', (e) => {
                verificarLocalizacaoCTO(e.target.value.trim());
            });
            
            macInput.addEventListener('input', searchMAC);
            macInput.addEventListener('change', searchMAC);
            macInput.addEventListener('blur', (e) => {
                e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9:]/g, '');
            });

            // 3.1 CONTROLE DO SINAL DA CTO (BOTÃO +/- E FORMATAÇÃO INTELIGENTE)
            const sinalCtoInput = document.getElementById('sinalCto');
            const btnSinalNegativo = document.getElementById('btn-sinal-negativo');

            btnSinalNegativo.addEventListener('click', () => {
                let val = sinalCtoInput.value.trim();
                if (val.startsWith('-')) {
                    sinalCtoInput.value = val.substring(1);
                } else if (val !== '') {
                    sinalCtoInput.value = '-' + val;
                } else {
                    sinalCtoInput.value = '-';
                }
                sinalCtoInput.focus();
            });

            sinalCtoInput.addEventListener('blur', (e) => {
                let val = e.target.value.trim();
                // Normalizar vírgula para ponto decimal
                val = val.replace(',', '.');
                if (val !== '' && !isNaN(val)) {
                    let num = parseFloat(val);
                    // Como sinal da CTO é sempre negativo em campo, garantimos o sinal de menos automaticamente
                    if (num > 0) num = -num;
                    e.target.value = num.toFixed(2);
                } else if (val === '-') {
                    e.target.value = '';
                }
            });

            // 4. GPS DE ALTA PRECISÃO (Melhorado)
            let watchId;
            let melhorPrecisao = 99999; // Armazena a melhor precisão encontrada
            
            function getGPS() {
                if (watchId) navigator.geolocation.clearWatch(watchId);
                locInput.value = "Calculando GPS Exato (Aguarde)...";
                btnGps.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                melhorPrecisao = 99999; // reseta a melhor precisão ao clicar de novo

                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            const acc = position.coords.accuracy;
                            
                            // Só atualiza na tela se a nova leitura for mais exata que a anterior
                            if (acc <= melhorPrecisao) {
                                melhorPrecisao = acc;
                                
                                // Removido o toFixed(6) para enviar todas as casas decimais como o Google Maps
                                locInput.value = `${lat}, ${lng} (Erro: ${acc.toFixed(0)}m)`;
                                
                                if (acc <= 15) {
                                    btnGps.innerHTML = '<i class="fa-solid fa-location-crosshairs" style="color: var(--success)"></i>';
                                } else {
                                    btnGps.innerHTML = '<i class="fa-solid fa-location-crosshairs" style="color: var(--warning)"></i>';
                                }
                                
                                // Agora não para de tentar melhorar, a menos que alcance 3 metros (quase perfeito)
                                if (acc <= 3) navigator.geolocation.clearWatch(watchId);
                            }
                        },
                        (error) => {
                            locInput.value = "Céu aberto / Permissão negada";
                            btnGps.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i>';
                        },
                        { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
                    );
                } else { locInput.value = "Sem GPS"; }
            }
            getGPS();
            btnGps.addEventListener('click', getGPS);

            // 5. ENVIO PARA O GOOGLE (SOMENTE ATUALIZAÇÃO E SALVAR FOTO/LOG)
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!SCRIPT_URL.startsWith("http")) {
                    alert("Aviso: Falta a URL do Apps Script no código!");
                    return;
                }

                if (photoBase64Value === "") {
                    alert("Aguarde a foto ser processada antes de enviar!");
                    return;
                }

                const btnSubmit = form.querySelector('button[type="submit"]');
                const originalBtnText = btnSubmit.innerHTML;
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Atualizando...';

                const locFinalCapturada = locInput.value.trim().split(' (')[0];
                const ctoFinalCapturada = ctoInput.value.trim().toUpperCase();
                const slotFinalCapturado = slotPonSelect.value;

                const formData = new URLSearchParams();
                formData.append('slotPon', slotFinalCapturado);
                formData.append('mac', macInput.value.trim().toUpperCase());
                formData.append('cto', ctoFinalCapturada);
                formData.append('localizacao', locFinalCapturada);
                formData.append('lacre', document.getElementById('lacre').value.trim().toUpperCase());
                formData.append('sinalCto', document.getElementById('sinalCto').value.trim());
                formData.append('colaborador', colaboradorSelect.value);
                formData.append('photoBase64', photoBase64Value);

                // Salva no cache a localização EXATA que foi injetada no formulário agora
                if (ctoFinalCapturada && slotFinalCapturado && locFinalCapturada && !locFinalCapturada.includes("Calculando") && !locFinalCapturada.includes("Sem GPS")) {
                    const cacheKey = 'loc_cto_' + slotFinalCapturado + '_' + ctoFinalCapturada;
                    localStorage.setItem(cacheKey, locFinalCapturada);
                }

                try {
                    await fetch(SCRIPT_URL, { method: 'POST', body: formData, mode: 'no-cors' });
                    
                    showToast("Dados enviados para Planilha!");
                    
                    const slotAtual = slotPonSelect.value;
                    const colabAtual = colaboradorSelect.value;
                    
                    limparCampos(true);
                    
                    slotPonSelect.value = slotAtual;
                    colaboradorSelect.value = colabAtual;
                    getGPS();
                } catch (err) {
                    alert("Erro de conexão ao salvar.");
                }

                btnSubmit.disabled = false;
                btnSubmit.innerHTML = originalBtnText;
            });

            document.getElementById('btn-cancelar').addEventListener('click', () => { 
                if (confirm('Apagar tudo?')) { 
                    const slotAtual = slotPonSelect.value;
                    const colabAtual = colaboradorSelect.value;
                    limparCampos(true);
                    slotPonSelect.value = slotAtual;
                    colaboradorSelect.value = colabAtual;
                    getGPS(); 
                } 
            });

            function limparCampos(limparMac) {
                if (limparMac) macInput.value = '';
                ctoInput.value = '';
                contratoInput.value = '';
                tipoClienteInput.value = '';
                document.getElementById('lacre').value = '';
                document.getElementById('sinalCto').value = '';
                obsContainer.classList.remove('show');
                obsTexto.innerText = "";
                
                // Limpar arquivo de foto
                fotoInput.value = "";
                photoBase64Value = "";
                uploadWrapper.classList.remove('has-file');
                uploadText.innerText = "Tirar Foto";
                uploadIcon.className = "fa-solid fa-camera";
            }

            function showToast(msg) {
                toastMsg.innerText = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 4000);
            }
        });
    </script>
</body>
</html>
