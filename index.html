328:         // 0.1 PREVIEW DA FOTO (Comprimir para Base64) - Robusto para Android
329:         let fotoProcessando = false;

331:         fotoInput.addEventListener('change', (e) => {
332:             const file = e.target.files[0];
333:             if (!file) return;
334: 
335:             // Indicar que está processando (NÃO confirmar antes de pronto)
336:             fotoProcessando = true;
337:             photoBase64Value = "";
338:             uploadWrapper.classList.add('has-file');
339:             uploadText.innerText = "Processando foto...";
340:             uploadIcon.className = "fa-solid fa-spinner fa-spin";
341: 
342:             // Timeout de segurança: se não processar em 15s, algo falhou
343:             const timeoutId = setTimeout(() => {
344:                 if (fotoProcessando) {
345:                     fotoProcessando = false;
346:                     photoBase64Value = "";
347:                     uploadWrapper.classList.remove('has-file');
348:                     uploadText.innerText = "Tirar Foto";
349:                     uploadIcon.className = "fa-solid fa-camera";
350:                     alert("A foto demorou demais para processar. Tente novamente.");
351:                 }
352:             }, 15000);
353: 
354:             const reader = new FileReader();
355: 
356:             reader.onload = function (event) {
357:                 const img = new Image();
358: 
359:                 img.onload = function () {
360:                     try {
361:                         // Comprimir a imagem (Max Width 800px para evitar travamento de rede)
362:                         const canvas = document.createElement('canvas');
363:                         const MAX_WIDTH = 800;
364:                         let width = img.width;
365:                         let height = img.height;
366: 
367:                         if (width > MAX_WIDTH) {
368:                             height *= MAX_WIDTH / width;
369:                             width = MAX_WIDTH;
370:                         }
371: 
372:                         canvas.width = width;
373:                         canvas.height = height;
374:                         const ctx = canvas.getContext('2d');
375:                         ctx.drawImage(img, 0, 0, width, height);
376: 
377:                         // Converter para base64 com qualidade 70%
378:                         const resultado = canvas.toDataURL('image/jpeg', 0.7);
379: 
380:                         if (resultado && resultado.length > 100) {
381:                             photoBase64Value = resultado;
382:                             fotoProcessando = false;
383:                             clearTimeout(timeoutId);

385:                             uploadIcon.className = "fa-solid fa-check";
386:                         } else {
387:                             throw new Error("Base64 vazio ou inv\u00e1lido");
388:                         }
389:                     } catch (compressErr) {
390:                         fotoProcessando = false;
391:                         clearTimeout(timeoutId);
392:                         photoBase64Value = "";
393:                         uploadWrapper.classList.remove('has-file');
394:                         uploadText.innerText = "Tirar Foto";
395:                         uploadIcon.className = "fa-solid fa-camera";
396:                         alert("Erro ao comprimir a foto. Tente tirar novamente.");
397:                     }
398:                 };
399:

401:                     fotoProcessando = false;
402:                     clearTimeout(timeoutId);
403:                     photoBase64Value = "";
404:                     uploadWrapper.classList.remove('has-file');
405:                     uploadText.innerText = "Tirar Foto";

489:         // 3. BUSCAR O MAC ESPECÍFICO DESSA ABA E EXIBIR INFORMAÇÕES
490:         function searchMAC() {
491:             if (ctoSemMacCheckbox.checked) return;
492:             let typed = macInput.value.trim().toUpperCase();
493:             const found = currentMacs.find(x => x.mac.toUpperCase() === typed);
494: 
495:             if (found) {
496:                 ctoInput.value = found.cto;
497:                 contratoInput.value = found.contrato;
498:                 tipoClienteInput.value = found.tipoCliente;
499: 
500:                 // LÓGICA DA OBSERVAÇÃO / INFORMAÇÃO
501:                 if (found.observacao && found.observacao.trim() !== "") {
502:                     obsTexto.innerText = found.observacao;
503:                     obsContainer.classList.add('show');
504:                 } else {
505:                     obsContainer.classList.remove('show');
506:                     obsTexto.innerText = "";
507:                 }
508:                 verificarLocalizacaoCTO(found.cto);
509:             } else {
510:                 contratoInput.value = '';
511:                 tipoClienteInput.value = '';
512:                 obsContainer.classList.remove('show');
513:                 obsTexto.innerText = "";
514:             }
515:         }
516:         function verificarLocalizacaoCTO(ctoVal) {
517:             if (!ctoVal) {
518:                 resetarParaGPS();
519:                 return false;
520:             }
521:             const slotVal = slotPonSelect.value;
522:             if (!slotVal) return false;
523: 
524:             // 1. Tentar pegar a localização direto da planilha (Master GPS)
525:             const macsDesteSlot = fullDatabase[slotVal] || [];
526:             const ctoComLoc = macsDesteSlot.find(m => m.cto.toUpperCase() === ctoVal.toUpperCase() && m.localizacao && m.localizacao.trim() !== "");
527: 
528:             if (ctoComLoc) {
529:                 if (watchId) navigator.geolocation.clearWatch(watchId);
530:                 locInput.value = ctoComLoc.localizacao + " (Copiado do Banco de Dados)";
531:                 btnGps.innerHTML = '<i class="fa-solid fa-cloud-arrow-down" style="color: var(--brand-purple)"></i>';
532:                 return true;
533:             }
534: 
535:             // 2. Se não tem na planilha, pegar do cache local do celular
536:             const cacheKey = 'loc_cto_' + slotVal.trim() + '_' + ctoVal.trim().toUpperCase();
537:             const savedLoc = localStorage.getItem(cacheKey);
538: 
539:             if (savedLoc) {
540:                 if (watchId) navigator.geolocation.clearWatch(watchId);
541:                 locInput.value = savedLoc + " (Copiado da mesma CTO local)";
542:                 btnGps.innerHTML = '<i class="fa-solid fa-clone" style="color: var(--success)"></i>';
543:                 return true;
544:             }
545: 
546:             // 3. Se nenhuma das anteriores achar localização, reinicia o GPS para medição limpa
547:             resetarParaGPS();
548:             return false;
549:         }
550: 
551:         function resetarParaGPS() {
552:             if (watchId) navigator.geolocation.clearWatch(watchId);
553:             locInput.value = "";
554:             btnGps.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i>';
555:             getGPS();
556:         }
557:         ctoInput.addEventListener('input', (e) => {
558:             verificarLocalizacaoCTO(e.target.value.trim());
559:         });
560: 
561:         macInput.addEventListener('input', searchMAC);
562:         macInput.addEventListener('change', searchMAC);
563:         macInput.addEventListener('blur', (e) => {
564:             e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9:]/g, '');
565:         });
566: 
567:         // 3.1 CONTROLE DO SINAL DA CTO (BOTÃO +/- E FORMATAÇÃO INTELIGENTE)
568:         const sinalCtoInput = document.getElementById('sinalCto');
569:         const btnSinalNegativo = document.getElementById('btn-sinal-negativo');
570: 
571:         btnSinalNegativo.addEventListener('click', () => {
572:             let val = sinalCtoInput.value.trim();
573:             if (val.startsWith('-')) {
574:                 sinalCtoInput.value = val.substring(1);
575:             } else if (val !== '') {
576:                 sinalCtoInput.value = '-' + val;
577:             } else {
578:                 sinalCtoInput.value = '-';
579:             }
580:             sinalCtoInput.focus();
581:         });
582: 
583:         sinalCtoInput.addEventListener('blur', (e) => {
584:             let val = e.target.value.trim();
585:             // Normalizar vírgula para ponto decimal
586:             val = val.replace(',', '.');
587:             if (val !== '' && !isNaN(val)) {
588:                 let num = parseFloat(val);
589:                 // Como sinal da CTO é sempre negativo em campo, garantimos o sinal de menos automaticamente
590:                 if (num > 0) num = -num;
591:                 e.target.value = num.toFixed(2);
592:             } else if (val === '-') {
593:                 e.target.value = '';
594:             }
595:         });
596: 
597:         // 4. GPS DE ALTA PRECISÃO (Melhorado)
600:         let watchId;
601:         let melhorPrecisao = 99999; // Armazena a melhor precisão encontrada
602: 
603:         function getGPS() {
604:             if (watchId) navigator.geolocation.clearWatch(watchId);
605:             locInput.value = "Calculando GPS Exato (Aguarde)...";
606:             btnGps.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
607:             melhorPrecisao = 99999; // reseta a melhor precisão ao clicar de novo
608: 
609:             if (navigator.geolocation) {
610:                 watchId = navigator.geolocation.watchPosition(
611:                     (position) => {
612:                         const lat = position.coords.latitude;
613:                         const lng = position.coords.longitude;
614:                         const acc = position.coords.accuracy;
615: 
616:                         // Só atualiza na tela se a nova leitura for mais exata que a anterior
617:                         if (acc <= melhorPrecisao) {
618:                             melhorPrecisao = acc;
619: 
620:                             // Removido o toFixed(6) para enviar todas as casas decimais como o Google Maps
621:                             locInput.value = `${lat}, ${lng} (Erro: ${acc.toFixed(0)}m)`;
622: 
623:                             if (acc <= 15) {
624:                                 btnGps.innerHTML = '<i class="fa-solid fa-location-crosshairs" style="color: var(--success)"></i>';
625:                             } else {
626:                                 btnGps.innerHTML = '<i class="fa-solid fa-location-crosshairs" style="color: var(--warning)"></i>';
627:                             }
628: 
629:                             // Agora não para de tentar melhorar, a menos que alcance 3 metros (quase perfeito)
630:                             if (acc <= 3) navigator.geolocation.clearWatch(watchId);
631:                         }
632:                     },
633:                     (error) => {
634:                         locInput.value = "C\u00e9u aberto / Permiss\u00e3o negada";
635:                         btnGps.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i>';
636:                     },
637:                     { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
638:                 );
639:             } else { locInput.value = "Sem GPS"; }
640:         }
641:         getGPS();
642:         btnGps.addEventListener('click', getGPS);
643: 
644:         // 5. ENVIO PARA O GOOGLE (SOMENTE ATUALIZAÇÃO E SALVAR FOTO/LOG)
645:         form.addEventListener('submit', async (e) => {
646:             e.preventDefault();
647: 
648:             if (!SCRIPT_URL.startsWith("http")) {
649:                 alert("Aviso: Falta a URL do Apps Script no c\u00f3digo!");
650:                 return;
651:             }
652: 
653:             if (fotoProcessando) {
654:                 alert("A foto ainda est\u00e1 sendo processada. Aguarde o \u00edcone mudar para \u2713 antes de enviar.");
655:                 return;
656:             }
657: 
658:             if (photoBase64Value === "") {
659:                 alert("Tire a foto antes de enviar! Verifique se aparece 'Foto Anexada!' com \u2713 verde.");
660:                 return;
661:             }
662: 
663:             const btnSubmit = form.querySelector('button[type="submit"]');
664:             const originalBtnText = btnSubmit.innerHTML;
665:             btnSubmit.disabled = true;
666:             btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Atualizando...';
667: 
668:             const isSemMac = ctoSemMacCheckbox.checked;
669:             const slotFinalCapturado = isSemMac ? "CTO SEM MACS" : slotPonSelect.value;
670:             const macFinal = isSemMac ? "CTO SEM MACS" : macInput.value.trim().toUpperCase();
671:             const lacreFinal = isSemMac ? "" : document.getElementById('lacre').value.trim().toUpperCase();
672:             const sinalFinal = isSemMac ? "" : document.getElementById('sinalCto').value.trim();
673:             const locFinalCapturada = locInput.value.trim().split(' (')[0];
674:             const ctoFinalCapturada = ctoInput.value.trim().toUpperCase();
675: 
676:             const formData = new URLSearchParams();
677:             formData.append('slotPon', slotFinalCapturado);
678:             formData.append('mac', macFinal);
679:             formData.append('cto', ctoFinalCapturada);
680:             formData.append('localizacao', locFinalCapturada);
681:             formData.append('lacre', lacreFinal);
682:             formData.append('sinalCto', sinalFinal);
683:             formData.append('colaborador', colaboradorSelect.value);
684:             formData.append('photoBase64', photoBase64Value);
685: 
686:             // Salva no cache a localização EXATA que foi injetada no formulário agora
687:             if (!isSemMac && ctoFinalCapturada && slotFinalCapturado && locFinalCapturada && !locFinalCapturada.includes("Calculando") && !locFinalCapturada.includes("Sem GPS")) {
688:                 const cacheKey = 'loc_cto_' + slotFinalCapturado + '_' + ctoFinalCapturada;
689:                 localStorage.setItem(cacheKey, locFinalCapturada);
690:             }
691: 
692:             if (useFirebase) {
693:                 // Envio direto do Base64 para o Realtime Database (bypass Firebase Storage)
694:                 try {
695:                     btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Gravando...';
696: 
697:                     const now = new Date();
698:                     // Formatar data/hora no padrão brasileiro de Manaus
699:                     const dataHoraStr = now.toLocaleDateString('pt-BR', { timeZone: 'America/Manaus' }) + ' ' + now.toLocaleTimeString('pt-BR', { timeZone: 'America/Manaus' });
700: 
701:                     // Gravar no Realtime Database (/registros)
702:                     const databaseRef = firebase.database().ref('/registros').push();
703:                     await databaseRef.set({
704:                         slotPon: slotFinalCapturado,
705:                         mac: macFinal,
706:                         cto: ctoFinalCapturada,
707:                         localizacao: locFinalCapturada,
708:                         lacre: lacreFinal,
709:                         sinalCto: sinalFinal,
710:                         colaborador: colaboradorSelect.value,
711:                         fotoBase64: photoBase64Value, // Envia como String Base64 direto no JSON
712:                         dataHora: dataHoraStr,
713:                         sincronizado: false
714:                     });
715: 
716:                     // Atualizar localmente a CTO e localização do MAC na memória
717:                     if (!isSemMac) {
718:                         const macsDesteSlot = fullDatabase[slotFinalCapturado] || [];
719:                         const found = macsDesteSlot.find(x => x.mac.toUpperCase() === macFinal.toUpperCase());
720:                         if (found) {
721:                             found.cto = ctoFinalCapturada;
722:                             found.localizacao = locFinalCapturada;
723:                         }
724:                     }
725: 
726:                     showToast("Enviado com Sucesso!");
727: 
728:                     const slotAtual = slotPonSelect.value;
729:                     const colabAtual = colaboradorSelect.value;
730:                     limparCampos(true);
731:                     slotPonSelect.value = slotAtual;
732:                     colaboradorSelect.value = colabAtual;
733:                     getGPS();
734: 
735:                 } catch (dbErr) {
736:                     console.error("Erro ao salvar dados no Firebase:", dbErr);
737:                     alert("Erro ao registrar os dados. Tente novamente.");
738:                 }
739:                 btnSubmit.disabled = false;
740:                 btnSubmit.innerHTML = originalBtnText;
741:             } else {
742:                 // Fluxo Legado (Google Apps Script)
743:                 try {
744:                     await fetch(SCRIPT_URL, { method: 'POST', body: formData, mode: 'no-cors' });
745: 
746:                     showToast("Dados enviados para Planilha!");
747: 
748:                     const slotAtual = slotPonSelect.value;
749:                     const colabAtual = colaboradorSelect.value;
750: 
751:                     limparCampos(true);
752: 
753:                     slotPonSelect.value = slotAtual;
754:                     colaboradorSelect.value = colabAtual;
755:                     getGPS();
756:                 } catch (err) {
757:                     alert("Erro de conex\u00e3o ao salvar.");
758:                 }
759: 
760:                 btnSubmit.disabled = false;
761:                 btnSubmit.innerHTML = originalBtnText;
762:             }
763:         });
764: 
765:         document.getElementById('btn-cancelar').addEventListener('click', () => {
766:             if (confirm('Apagar tudo?')) {
767:                 const slotAtual = slotPonSelect.value;
768:                 const colabAtual = colaboradorSelect.value;
769:                 limparCampos(true);
770:                 slotPonSelect.value = slotAtual;
771:                 colaboradorSelect.value = colabAtual;
772:                 getGPS();
773:             }
774:         });
775: 
776:         function limparCampos(limparMac) {
777:             ctoSemMacCheckbox.checked = false;
778:             handleCtoSemMacToggle();
779: 
780:             if (limparMac) macInput.value = '';
781:             ctoInput.value = '';
782:             contratoInput.value = '';
783:             tipoClienteInput.value = '';
784:             document.getElementById('lacre').value = '';
785:             document.getElementById('sinalCto').value = '';
786:             obsContainer.classList.remove('show');
787:             obsTexto.innerText = "";
788: 
789:             // Limpar arquivo de foto
790:             fotoInput.value = "";
791:             photoBase64Value = "";
792:             uploadWrapper.classList.remove('has-file');
793:             uploadText.innerText = "Tirar Foto";
794:             uploadIcon.className = "fa-solid fa-camera";
795:         }
796: 
797:         function showToast(msg) {
798:             toastMsg.innerText = msg;
799:             toast.classList.add('show');
800:             setTimeout(() => toast.classList.remove('show'), 4000);
801:         }
802:     });
803: </script>
